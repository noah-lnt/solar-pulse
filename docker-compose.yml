name: solarpulse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solarpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-solarpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - solarpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solarpulse}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  warp:
    image: caomingjun/warp:2026.8.2110.0-2.12.0
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 10:200 rwm'
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      WARP_SLEEP: 2
    volumes:
      - ./warp-data:/var/lib/cloudflare-warp
    networks:
      - solarpulse
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TZ: Europe/Paris
      HOYMILES_PROXY_URL: http://warp:1080
    depends_on:
      postgres:
        condition: service_healthy
      warp:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - solarpulse
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - solarpulse
      - web
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      - "traefik.enable=true"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.solarpulse-http.rule=Host(`${TRAEFIK_HOST:-solarpulse.local}`)"
      - "traefik.http.routers.solarpulse-http.entrypoints=web"
      - "traefik.http.routers.solarpulse-http.middlewares=solarpulse-https-redirect"
      - "traefik.http.middlewares.solarpulse-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.solarpulse-https-redirect.redirectscheme.permanent=true"
      # HTTPS
      - "traefik.http.routers.solarpulse.rule=Host(`${TRAEFIK_HOST:-solarpulse.local}`)"
      - "traefik.http.routers.solarpulse.entrypoints=websecure"
      - "traefik.http.routers.solarpulse.tls=true"
      - "traefik.http.routers.solarpulse.tls.certresolver=letsencrypt"
      - "traefik.http.services.solarpulse.loadbalancer.server.port=80"
      - "traefik.docker.network=web"

volumes:
  pgdata:

networks:
  solarpulse:
    driver: bridge
  web:
    external: true
